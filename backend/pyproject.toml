[project]
name = "backend"
version = "0.1.0"
description = "Backend FastAPI del MVP de Asistencia y Cálculo de Sueldos de Agua ReNew"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "qrcode>=8.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "pillow>=11.0.0",
    "boto3>=1.35.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Proyecto de aplicación: no se empaqueta, solo se ejecuta desde el venv.
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto>=5.1.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requiere TEST_DATABASE_URL (PostgreSQL + Alembic)",
    "live_s3: requiere OBJECT_STORE_ENDPOINT (MinIO u otro S3 local)",
]
